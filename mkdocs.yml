# ============================================================
# AIC-26 Documentation Configuration
# ============================================================

site_name: AIC-26 Documentation
site_description: AI Challenge Video Retrieval System
site_author: AIC Team
repo_url: https://github.com/your-org/aic26
repo_name: aic26

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_category_heading: true
            show_bases: true
            heading_level: 2

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.tasklist
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Configuration: getting-started/configuration.md
  - User Guide:
    - CLI Commands: user-guide/cli.md
    - API Reference: user-guide/api.md
    - Desktop GUI: user-guide/gui.md
    - Pipeline: user-guide/pipeline.md
  - Architecture:
    - Overview: architecture/overview.md
    - Core Engine: architecture/core.md
    - Data Flow: architecture/data-flow.md
  - API Reference:
    - Search: api/search.md
    - TRAKE: api/trake.md
    - Export: api/export.md
  - Development:
    - Contributing: development/contributing.md
    - Testing: development/testing.md
    - Deployment: development/deployment.md
  - Changelog: changelog.md