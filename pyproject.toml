[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aic26"
version = "1.0.0"
description = "AI Challenge Video Retrieval System - EVA-02 based intelligent video search"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "AIC Team", email = "team@aic26.dev"}
]
keywords = ["video-retrieval", "clip", "faiss", "computer-vision", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "faiss-cpu>=1.7.4",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "gunicorn>=21.0.0",
    "open-clip-torch>=2.24.0",
    "timm>=0.9.0",
    "transformers>=4.40.0",
    "ultralytics>=8.4.0",
    "customtkinter>=5.2.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "click>=8.1.0",
    "rank-bm25>=0.2.2",
    # PaddleOCR is the OCR engine actually used by pipeline/ocr.py and
    # pipeline/ocr_gpu.py (constants.OCR_LANGUAGES uses its language codes).
    # paddlepaddle itself is CUDA/CPU-specific like torch — install it
    # separately first, see requirements.txt for the exact commands:
    #   CPU: pip install paddlepaddle==3.0.0
    #   GPU: pip install paddlepaddle-gpu==2.6.2
    "paddleocr>=2.9.0",
]

[project.optional-dependencies]
gpu = [
    "faiss-gpu>=1.7.4",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
    "httpx>=0.25.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.2.0",
    "mkdocstrings[python]>=0.23.0",
]

[project.scripts]
aic26 = "aic26.cli.main:cli"

[project.urls]
Homepage = "https://github.com/your-org/aic26"
Documentation = "https://aic26.readthedocs.io"
Repository = "https://github.com/your-org/aic26.git"
"Issue Tracker" = "https://github.com/your-org/aic26/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aic26"]

[tool.black]
line-length = 100
target-version = ['py310']
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = false
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchvision.*",
    "open_clip.*",
    "transformers.*",
    "ultralytics.*",
    "faiss.*",
    "cv2.*",
    "customtkinter.*",
    "matplotlib.*",
    "loguru.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=aic26",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-fail-under=0",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src/aic26"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]